<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Weather</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080e1c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffd15c'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #080e1c;
    --fg: #e2e8f0;
    --accent: #78c6ff;
    --bar: #0e203a;
    --panel: #0c1628;
    --border: #4074a8;
    --hi: #1856a8;
    --hi-fg: #f4f8ff;
    --shadow: #03050a;
    --normal: #e2e8f0;
    --precip: #5aaaff;
    --wind: #8cc8aa;
    --hot: #e67850;
    --cold: #82bee6;
    --watch: #e6be46;
    --warning: #dc4646;
    --stale: #c88c3c;
    --muted: #8c929e;
    --font: "Segoe UI", "Avenir Next", "Helvetica Neue", sans-serif;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
  }
  html[data-theme="high-contrast"] {
    --bg: #000;
    --fg: #fff;
    --accent: #ffe14a;
    --bar: #000;
    --panel: #000;
    --border: #fff;
    --hi: #ffe14a;
    --hi-fg: #000;
    --shadow: #000;
    --normal: #fff;
    --precip: #66ffff;
    --wind: #5dff8a;
    --hot: #ff5a5a;
    --cold: #66ffff;
    --watch: #ffe14a;
    --warning: #ff7a7a;
    --stale: #ffe14a;
    --muted: #c8c8c8;
  }
  html[data-theme="night"] {
    --bg: #0a0908;
    --fg: #c4baa6;
    --accent: #d6a860;
    --bar: #16120e;
    --panel: #100d0a;
    --border: #806440;
    --hi: #704e24;
    --hi-fg: #ffecd2;
    --shadow: #040302;
    --normal: #c4baa6;
    --precip: #7896be;
    --wind: #96aa8c;
    --hot: #c88250;
    --cold: #82a0be;
    --watch: #c4a046;
    --warning: #be5046;
    --stale: #aa8246;
    --muted: #6e6a60;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 420px at 8% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 55%),
      var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.4;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #app { min-height: 100%; display: flex; flex-direction: column; }
  .top, .foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    background: var(--bar);
    padding: 10px 16px;
  }
  .place {
    border-left: 4px solid var(--accent);
    padding-left: 10px;
    font-weight: 700;
    font-size: 16px;
  }
  .head-temp { font-weight: 750; font-size: 20px; letter-spacing: -0.03em; }
  .head-cond { display: flex; align-items: center; gap: 6px; font-weight: 650; }
  .ages { margin-left: auto; color: var(--muted); font-size: 12.5px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 0; }
  .tabs button, .foot button, .texty {
    border: 0;
    background: var(--bar);
    color: var(--fg);
    border-radius: 999px;
    padding: 6px 12px;
  }
  .tabs button[aria-selected="true"] { background: var(--hi); color: var(--hi-fg); font-weight: 750; }
  .main { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr); gap: 12px; align-items: start; }
  .panel {
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px 16px 16px;
    min-width: 0;
  }
  .panel h2, .dialog h2 {
    margin: 0 0 12px;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .banner { border-color: var(--watch); color: var(--watch); }
  .now-hero { display: grid; grid-template-columns: minmax(180px, 250px) minmax(0, 1fr); gap: 8px 18px; align-items: center; }
  .temp-xl { font-size: clamp(52px, 7vw, 76px); font-weight: 720; letter-spacing: -0.045em; line-height: 0.9; margin: 0; }
  .cond { font-size: 22px; font-weight: 700; margin: 6px 0; }
  .meta { color: var(--muted); margin: 2px 0; }
  .stat { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .precip-line { color: var(--precip); font-weight: 650; margin-top: 8px; }
  .wx { display: block; width: 100%; height: auto; }
  .wx-mini { width: 78px; }
  .wx-sig { width: 36px; height: 26px; }
  .spark { width: 100%; height: 76px; display: block; margin: 4px 0 8px; }
  .compass { width: 64px; height: 64px; color: var(--fg); }
  .sunarc { width: 100%; height: 78px; display: block; margin-top: 6px; }
  .meter { width: 92px; height: 8px; }
  .cards, .strip { display: grid; gap: 8px; }
  .cards { grid-auto-flow: column; grid-auto-columns: 124px; overflow-x: auto; padding-bottom: 4px; }
  .strip { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  .card, .slot, .row, .loc-row, .filter-row {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 14px;
    color: var(--fg);
    text-align: left;
  }
  .card, .slot { padding: 8px 8px 10px; }
  .card[aria-selected="true"], .row[aria-selected="true"], .loc-row[aria-selected="true"], .filter-row[aria-selected="true"] {
    background: var(--hi);
    color: var(--hi-fg);
    border-color: var(--accent);
  }
  .card .wx-mini { width: 100%; }
  .card-title, .slot .when { font-weight: 750; font-size: 13px; }
  .card-temp, .slot .temp { font-weight: 750; }
  .slot { text-align: center; }
  .slot .pop, .pop { color: var(--precip); font-variant-numeric: tabular-nums; }
  .card[aria-selected="true"] .pop, .row[aria-selected="true"] .pop { color: inherit; }
  .list { display: flex; flex-direction: column; gap: 4px; max-height: min(62vh, 640px); overflow: auto; }
  .row {
    width: 100%;
    display: grid;
    grid-template-columns: 6.2rem 36px 4.6rem 3.1rem 96px minmax(0, 1fr);
    gap: 8px;
    align-items: center;
    padding: 6px 8px;
    border-radius: 10px;
  }
  .row .short, .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { color: var(--watch); font-size: 12px; font-weight: 750; }
  .muted { color: var(--muted); }
  .role-normal { color: var(--normal); }
  .role-precip { color: var(--precip); }
  .role-wind { color: var(--wind); }
  .role-hot, .t-hot { color: var(--hot); }
  .role-cold, .t-cold { color: var(--cold); }
  .role-watch, .t-warm { color: var(--watch); }
  .role-warning { color: var(--warning); }
  .role-stale, .t-stale { color: var(--stale); }
  .role-muted, .t-none { color: var(--muted); }
  .callout {
    margin: 10px 12px 0;
    border: 3px solid var(--warning);
    border-radius: 14px;
    background: var(--bar);
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
  }
  .callout button.dismiss, .primary, .ghost {
    border: 0;
    border-radius: 999px;
    padding: 6px 12px;
    font-weight: 750;
  }
  .dismiss, .primary { background: var(--hi); color: var(--hi-fg); }
  .dismiss { background: var(--warning); color: white; }
  html[data-theme="high-contrast"] .dismiss { color: #000; }
  .ghost { background: var(--bar); color: var(--fg); border: 1px solid var(--border); }
  .foot { gap: 6px; }
  .foot button { background: transparent; border-radius: 8px; padding: 4px 6px; color: var(--muted); }
  .foot kbd, kbd {
    background: var(--hi);
    color: var(--hi-fg);
    border-radius: 5px;
    padding: 1px 6px;
    font-family: inherit;
    font-weight: 750;
    font-size: 12px;
  }
  .status { color: var(--muted); font-size: 12.5px; }
  .scrim {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--shadow) 72%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    z-index: 5;
  }
  .dialog {
    width: min(720px, 100%);
    max-height: min(84vh, 820px);
    overflow: auto;
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    padding: 16px 18px 18px;
  }
  .dialog h2 { display: inline-block; background: var(--hi); color: var(--hi-fg); border-radius: 999px; padding: 3px 10px; text-transform: none; letter-spacing: 0; }
  .field {
    width: min(100%, 460px);
    background: var(--hi);
    color: var(--hi-fg);
    border: 0;
    border-radius: 10px;
    padding: 8px 10px;
  }
  .loc-row, .filter-row { width: 100%; padding: 8px 10px; margin-top: 6px; }
  .prose { white-space: pre-wrap; font-family: var(--mono); font-size: 13px; line-height: 1.45; }
  .detail-art { width: min(240px, 70%); }
  .help-grid { display: grid; grid-template-columns: 7rem 1fr 7rem 1fr; gap: 6px 8px; }
  .help-grid b { color: var(--accent); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .gfs { color: var(--watch); font-weight: 750; }
  .empty { color: var(--muted); padding: 12px 0; }
  @media (max-width: 900px) {
    .split, .now-hero { grid-template-columns: 1fr; }
    .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .row { grid-template-columns: 4.2rem 32px 3.6rem 2.6rem minmax(0, 1fr); }
    .row .meter-wrap { display: none; }
    .ages { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wx * { animation: none !important; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(() => {
  const KEY = "local-weather-html-v1";
  const CATS = [
    ["tornado", "tornado"],
    ["severeThunderstorm", "severe thunderstorm"],
    ["flashFlood", "flash flood"],
    ["flood", "flood"],
    ["winterStorm", "winter storm"],
    ["ice", "ice"],
    ["wind", "wind"],
    ["heat", "heat"],
    ["denseFog", "dense fog"],
    ["specialWeatherStatement", "special weather statement"],
    ["other", "other"]
  ];
  const TABS = [
    ["now", "1 Now"],
    ["hourly", "2 Hourly"],
    ["seven", "3 7-day"],
    ["twelve", "4 12-day"],
    ["alerts", "5 Alerts"],
    ["discussion", "6 Discussion"]
  ];

  const state = {
    cfg: defaultCfg(),
    caches: {},
    tab: "now",
    overlay: "none",
    status: "starting",
    notice: "",
    selected: 0,
    filterSel: 0,
    observation: null,
    forecast: null,
    hourly: null,
    grid: null,
    extended: null,
    extendedError: null,
    alerts: [],
    alertCache: emptyAlertCache(),
    alertsAt: null,
    discussion: null,
    discussionAvailable: false,
    precipLine: null,
    calloutId: null,
    knownAlertKeys: [],
    focusLoc: false,
    draft: "",
    resolving: false,
    inflight: { obs: false, fcst: 0, alerts: false },
    fail: { obs: 0, fcst: 0, alerts: 0 },
    next: { obs: 0, fcst: 0, alerts: 0 },
    alertInterval: 30
  };

  let svgSeq = 0;
  const motionOk = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function defaultCfg() {
    return {
      theme: "default",
      units: "imperial",
      active: null,
      filters: Object.fromEntries(CATS.map(([k]) => [k, true])),
      dismissed: [],
      locations: []
    };
  }
  function emptyAlertCache() {
    const bucket = () => ({ etag: null, alerts: [], fetchedAt: null });
    return { point: bucket(), zone: bucket(), county: bucket() };
  }

  function loadStore() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (saved.cfg) state.cfg = { ...defaultCfg(), ...saved.cfg, filters: { ...defaultCfg().filters, ...(saved.cfg.filters || {}) } };
      if (saved.caches) state.caches = saved.caches;
    } catch (err) {
      state.status = "saved settings could not be read";
    }
  }
  function saveStore() {
    const nick = state.cfg.active;
    if (nick) {
      state.caches[nick] = {
        observation: state.observation,
        forecast: state.forecast,
        hourly: state.hourly,
        grid: state.grid,
        extended: state.extended,
        extendedError: state.extendedError,
        alertCache: state.alertCache,
        alertsAt: state.alertsAt,
        discussion: state.discussion,
        knownAlertKeys: state.knownAlertKeys
      };
    }
    try {
      localStorage.setItem(KEY, JSON.stringify({ cfg: state.cfg, caches: state.caches }));
    } catch (err) {
      state.status = "could not save locally";
    }
  }
  function applyCache(nick) {
    const c = state.caches[nick] || {};
    state.observation = c.observation || null;
    state.forecast = c.forecast || null;
    state.hourly = c.hourly || null;
    state.grid = c.grid || null;
    state.extended = c.extended || null;
    state.extendedError = c.extendedError || null;
    state.alertCache = c.alertCache || emptyAlertCache();
    state.alerts = mergeAlerts(state.alertCache);
    state.alertsAt = c.alertsAt || null;
    state.discussion = c.discussion || null;
    state.discussionAvailable = !!(state.discussion && state.discussion.data);
    state.knownAlertKeys = c.knownAlertKeys || state.alerts.map(alertKey);
    state.calloutId = null;
    recomputePrecip();
    const loc = active();
    if (!state.observation && !state.forecast && state.alerts.length === 0) {
      state.notice = loc ? `No cached weather for ${loc.query} and nothing fetched yet.` : "";
    } else {
      state.notice = "";
    }
  }

  function active() {
    return state.cfg.locations.find((l) => l.nickname === state.cfg.active) || null;
  }
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function num(v) { return typeof v === "number" && Number.isFinite(v) ? v : null; }
  function rem(a, n) { return ((a % n) + n) % n; }
  function rad(d) { return d * Math.PI / 180; }
  function deg(r) { return r * 180 / Math.PI; }
  function cToF(c) { return c * 9 / 5 + 32; }
  function fToC(f) { return (f - 32) * 5 / 9; }
  function slug(q) {
    const s = q.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 32);
    return s || "location";
  }
  function zip5(q) {
    const digits = q.replace(/\D/g, "");
    if ((q.length === 5 || (q.length === 10 && q[5] === "-")) && digits.length >= 5 && /^[\d-]+$/.test(q)) return q.slice(0, 5);
    if (digits.length === 5 && /^\d+$/.test(q)) return q;
    return null;
  }
  function fmtTemp(f) {
    if (f == null) return "—";
    return state.cfg.units === "metric" ? `${Math.round(fToC(f))}°C` : `${Math.round(f)}°F`;
  }
  function fmtWind(mph) {
    if (mph == null) return "—";
    return state.cfg.units === "metric" ? `${Math.round(mph * 0.868976)} kt` : `${Math.round(mph)} mph`;
  }
  function fmtPres(inhg) {
    if (inhg == null) return "—";
    return state.cfg.units === "metric" ? `${Math.round(inhg * 33.8639)} mb` : `${inhg.toFixed(2)} inHg`;
  }
  function fmtPrecip(inches) {
    if (inches == null) return "—";
    if (Math.abs(inches) < 0.001) return "0";
    return state.cfg.units === "metric" ? `${(inches * 25.4).toFixed(1)} mm` : `${inches.toFixed(2)} in`;
  }
  function fmtVis(miles) {
    if (miles == null) return "—";
    return state.cfg.units === "metric" ? `${(miles * 1.60934).toFixed(1)} km` : `${miles.toFixed(1)} mi`;
  }
  function unitsLabel() { return state.cfg.units === "metric" ? "°C kt mb" : "°F mph inHg"; }
  function compass(degv) {
    if (degv == null) return "—";
    const dirs = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
    return dirs[Math.floor((rem(degv, 360) + 11.25) / 22.5) % 16];
  }
  function tempClass(f) {
    if (f == null) return "t-none";
    if (f >= 90) return "t-hot";
    if (f >= 75) return "t-warm";
    if (f <= 32) return "t-cold";
    return "";
  }
  function conditionRole(text, tempF) {
    const t = String(text || "").toLowerCase();
    if (t.includes("tornado") || t.includes("severe")) return "warning";
    if (t.includes("thunder") || t.includes("rain") || t.includes("shower") || t.includes("drizzle")) return "precip";
    if (t.includes("snow") || t.includes("sleet") || t.includes("ice") || t.includes("freezing")) return "cold";
    if (t.includes("wind") || t.includes("breezy") || t.includes("blustery")) return "wind";
    if (t.includes("fog") || t.includes("haze") || t.includes("mist")) return "muted";
    if (tempF != null && tempF >= 90) return "hot";
    if (tempF != null && tempF <= 32) return "cold";
    return "normal";
  }
  function severityRole(sev) {
    const s = String(sev || "").toLowerCase();
    if (s === "extreme" || s === "severe") return "warning";
    if (s === "moderate") return "watch";
    return "normal";
  }
  function categorize(event) {
    const e = String(event || "").toLowerCase();
    if (e.includes("tornado")) return "tornado";
    if (e.includes("severe thunderstorm") || e.includes("thunderstorm")) return "severeThunderstorm";
    if (e.includes("flash flood")) return "flashFlood";
    if (e.includes("flood")) return "flood";
    if (e.includes("ice") || e.includes("freezing") || e.includes("sleet")) return "ice";
    if (e.includes("winter") || e.includes("blizzard") || e.includes("snow")) return "winterStorm";
    if (e.includes("wind")) return "wind";
    if (e.includes("heat")) return "heat";
    if (e.includes("fog")) return "denseFog";
    if (e.includes("special weather statement")) return "specialWeatherStatement";
    return "other";
  }
  function allows(cat) { return state.cfg.filters[cat] !== false; }
  function severityRank(sev) {
    return { extreme: 5, severe: 4, moderate: 3, minor: 2 }[String(sev || "").toLowerCase()] || 1;
  }
  function wmoSummary(code) {
    const map = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast", 45: "Fog", 48: "Fog", 51: "Drizzle", 53: "Drizzle", 55: "Drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle", 61: "Rain", 63: "Rain", 65: "Rain", 66: "Freezing rain", 67: "Freezing rain", 71: "Snow", 73: "Snow", 75: "Snow", 77: "Snow grains", 80: "Rain showers", 81: "Rain showers", 82: "Rain showers", 85: "Snow showers", 86: "Snow showers", 95: "Thunderstorm", 96: "Thunderstorm with hail", 99: "Thunderstorm with hail" };
    return map[code] || "Unknown";
  }
  function skyKind(text, daytime) {
    const t = String(text || "").toLowerCase();
    if (t.includes("thunder") || t.includes("tstm")) return "storm";
    if (t.includes("snow") || t.includes("flurr") || t.includes("blizzard") || t.includes("sleet") || t.includes("ice")) return "snow";
    if (t.includes("rain") || t.includes("shower") || t.includes("drizzle")) return "rain";
    if (t.includes("fog") || t.includes("mist") || t.includes("haze")) return "fog";
    if (t.includes("wind") || t.includes("breezy") || t.includes("blustery")) return "wind";
    if (t.includes("partly") || t.includes("mostly sunny") || t.includes("mostly clear")) return daytime ? "partly" : "partlyNight";
    if (t.includes("cloud") || t.includes("overcast")) return "cloud";
    return daytime ? "sun" : "moon";
  }
  function ageLabel(iso, now = Date.now()) {
    if (!iso) return "unknown age";
    const secs = Math.max(0, Math.floor((now - new Date(iso).getTime()) / 1000));
    if (secs < 60) return `${secs}s ago`;
    if (secs < 3600) return `${Math.floor(secs / 60)}m ago`;
    if (secs < 86400) return `${Math.floor(secs / 3600)}h ago`;
    return `${Math.floor(secs / 86400)}d ago`;
  }
  function countdown(iso, now = Date.now()) {
    if (!iso) return "—";
    const secs = Math.floor((new Date(iso).getTime() - now) / 1000);
    if (secs <= 0) return "expired";
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }
  function ymdInZone(date, timeZone) {
    const parts = new Intl.DateTimeFormat("en-US", { timeZone: timeZone || "UTC", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(date);
    const g = (t) => +parts.find((p) => p.type === t).value;
    return { y: g("year"), m: g("month"), d: g("day") };
  }
  function localHM(iso, tz) {
    if (!iso) return "—";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "—";
    return new Intl.DateTimeFormat("en-GB", { timeZone: tz || "UTC", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(d);
  }

  function drawKind(kind, id) {
    if (kind === "sun") return sunBody(id, 140, 100, 34);

    if (kind === "partlyNight") return stars() + moonBody(id, 104, 74, 24) + cloud(id, 160, 116, 0.76, "#e7edf5");
    if (kind === "cloud") return cloud(id, 140, 96, 1, "#f4f7fb");
    if (kind === "rain") return cloud(id, 140, 78, 0.92, "#f3f7fb") + rain(id);
    if (kind === "storm") {

  function sparkSvg(vals) {
    const nums = vals.filter((v) => typeof v === "number");

  function detailBody() {
    if (state.tab === "alerts") {
      const a = state.alerts[state.selected];
      if (!a) return ["alert", "No alert."];
      const body = `${a.event}\n${a.headline}\nseverity ${a.severity}  urgency ${a.urgency}  certainty ${a.certainty}\nonset ${a.onset || "—"}\nexpires ${a.expires || "—"}\nends ${a.ends || "—"}\nsent ${a.sent || "—"}\nupdated ${a.updated || "—"}\n${a.sender}\n${a.area}\n\n${a.instruction}\n\n${a.description}`;
      return [a.event, body];
    }
    if (state.tab === "seven" || state.tab === "hourly") {
      const periods = (state.tab === "seven" ? state.forecast?.data.periods : state.hourly?.data.periods) || [];
      const p = periods[state.selected];
      if (!p) return ["detail", "No detail."];
      return [p.name, `${p.name}\n${fmtTemp(p.tempF)}\n${p.short}\n${p.wind} ${p.windDir}\npop ${p.pop == null ? "—" : Math.round(p.pop) + "%"}\n\n${p.detailed}`];
    }
    if (state.tab === "twelve") {
      const d = state.extended?.data.days[state.selected];
      if (!d) return ["day", "No detail."];
      const note = state.selected >= 7 ? "\nGuidance only. Not an NWS forecast." : `\nNWS same day ${fmtTemp(d.nwsHighF)} / ${fmtTemp(d.nwsLowF)}`;
      return [shortDate(d.date), `${fmtTemp(d.highF)} / ${fmtTemp(d.lowF)}\n${d.summary}\npop ${d.pop == null ? "—" : Math.round(d.pop) + "%"}\nprecip ${fmtPrecip(d.precipIn)}  wind ${fmtWind(d.windMph)}  gust ${fmtWind(d.gustMph)}${note}`];
    }
    const a = calloutAlert();
    return a ? [a.event, a.headline || a.event] : ["detail", "No detail."];
  }
  function overlay() {
    if (state.overlay === "help") {
      return `<div class="scrim" data-act="close"><div class="dialog" role="dialog" aria-labelledby="dlg-title">
        <h2 id="dlg-title">help</h2>
        <div class="help-grid">
          <b>1–6</b><span>tabs</span><b>j / k</b><span>move</span>
          <b>enter</b><span>open</span><b>x</b><span>dismiss</span>
          <b>r</b><span>refresh</span><b>a</b><span>alerts</span>
          <b>l</b><span>location</span><b>t</b><span>theme</span>
          <b>u</b><span>units</span><b>f</b><span>filters</span>
          <b>?</b><span>this card</span><b>q</b><span>close dialog</span>
        </div>
        <p class="muted">Mouse hits the same tabs, rows, callout, and dismiss. The 12-day pane is NOAA GFS guidance, not an NWS forecast.</p>
        <p class="muted">Places come from the US Census Bureau. Observations, forecasts, alerts, and the area discussion come from the National Weather Service. Days 8–12 come from Open-Meteo using the NOAA GFS model only. No API key. If a browser blocks these requests from a file on disk, serve this folder with a local web server.</p>
        <div class="actions"><button type="button" class="primary" data-act="close">close</button></div>
      </div></div>`;
    }
    if (state.overlay === "location") {
      const rows = state.cfg.locations.map((loc, i) => `<button type="button" class="loc-row" data-act="switch" data-i="${i}" aria-selected="${i === state.selected}">${esc(loc.nickname)} · ${esc(loc.query)} · ${loc.lat.toFixed(3)}, ${loc.lon.toFixed(3)}</button>`).join("");
      return `<div class="scrim" data-act="close"><form class="dialog" role="dialog" aria-labelledby="dlg-title" data-act="resolve">
        <h2 id="dlg-title">location</h2>
        <p>US ZIP or street address</p>
        <input class="field" id="loc-input" name="q" autocomplete="off" spellcheck="false" placeholder="29672 or 123 Main St, Seneca, SC" aria-label="US ZIP or street address" value="${esc(state.draft)}">
        <div style="margin-top:10px">${rows || `<p class="muted">No saved locations.</p>`}</div>
        ${state.notice ? `<p class="role-stale">${esc(state.notice)}</p>` : ""}
        <div class="actions">
          <button type="button" class="ghost" data-act="delete-loc">Del</button>
          <button type="button" class="ghost" data-act="close">Esc</button>
          <button type="submit" class="primary">Enter</button>
        </div>
      </form></div>`;
    }
    if (state.overlay === "filters") {
      const rows = CATS.map(([key, label], i) => `<button type="button" class="filter-row" data-act="filter" data-i="${i}" aria-selected="${i === state.filterSel}">${state.cfg.filters[key] ? "[x]" : "[ ]"}  ${esc(label)}</button>`).join("");
      return `<div class="scrim" data-act="close"><div class="dialog" role="dialog" aria-labelledby="dlg-title">
        <h2 id="dlg-title">alert categories</h2>
        <p class="muted">Disabled categories stay listed, without a callout.</p>
        ${rows}
        <div class="actions"><button type="button" class="ghost" data-act="close">close</button></div>
      </div></div>`;
    }
    if (state.overlay === "detail") {
      const [title, body] = detailBody();
      const alertOpen = state.tab === "alerts";
      return `<div class="scrim" data-act="close"><div class="dialog" role="dialog" aria-labelledby="dlg-title">
        <h2 id="dlg-title">${esc(title)}</h2>
        <div class="prose" id="detail-body">${esc(body)}</div>
        <div class="actions">
          ${alertOpen ? `<button type="button" class="ghost" data-act="dismiss">x dismiss</button>` : ""}
          <button type="button" class="primary" data-act="close">Esc</button>
        </div>
      </div></div>`;
    }
    return "";
  }
  function render() {
    const n = listLen();
    if (state.selected >= n) state.selected = Math.max(0, n - 1);
    document.documentElement.dataset.theme = state.cfg.theme === "high-contrast" || state.cfg.theme === "night" ? state.cfg.theme : "default";
    const locFocused = document.activeElement?.id === "loc-input";
    const mainScroll = document.querySelector(".main")?.scrollTop || 0;
    svgSeq = 0;
    document.getElementById("app").innerHTML = `${header()}${callout()}${tabs()}<main class="main">${pane()}</main>${footer()}${overlay()}`;
    const main = document.querySelector(".main");
    if (main) main.scrollTop = mainScroll;
    const selected = document.querySelector('.row[aria-selected="true"], .card[aria-selected="true"]');
    if (selected && state.tab !== "now") selected.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (state.focusLoc || locFocused) {
      const input = document.getElementById("loc-input");
      if (input) {
        input.focus();
        const n = input.value.length;
        input.setSelectionRange(n, n);
      }
      state.focusLoc = false;
    }
  }

  function backoff(attempt, cap) { return Math.min(2 ** Math.min(attempt, 8), cap); }
  function serverErr(err) { return /NWS 500|NWS 503/.test(String(err?.message || err)); }
  async function loadObs() {
    const loc = active();
    if (!loc || state.inflight.obs) return;
    state.inflight.obs = true;
    try {
      const data = await observation(loc);
      state.observation = { fetchedAt: new Date().toISOString(), data };
      state.fail.obs = 0;
      state.notice = "";
      if (loc) loc.lastSuccess = new Date().toISOString();
      state.status = "observation updated";
      saveStore();
    } catch (err) {
      state.fail.obs += 1;
      const wait = serverErr(err) ? backoff(state.fail.obs, 300) : Math.max(60, 600);
      state.next.obs = Date.now() + wait * 1000;
      state.status = state.observation ? `observation failed (${err.message}); showing cache` : `No cached observation for ${loc.query} and the network request failed: ${err.message}`;
      if (!state.observation) state.notice = state.status;
    } finally {
      state.inflight.obs = false;
      render();
    }
  }
  async function loadForecasts() {
    const loc = active();
    if (!loc || state.inflight.fcst) return;
    const stalePoints = !loc.pointsResolvedAt || (Date.now() - new Date(loc.pointsResolvedAt).getTime()) >= 86400000;
    if (stalePoints) {
      points(loc.lat, loc.lon).then((point) => {
        loc.point = point;
        loc.pointsResolvedAt = new Date().toISOString();
        saveStore();
      }).catch(() => {});
    }
    state.inflight.fcst = 4;
    const done = () => {
      state.inflight.fcst -= 1;
      if (state.inflight.fcst <= 0) {
        state.inflight.fcst = 0;
        saveStore();
        render();
      }
    };
    const fail = (what, err) => {
      state.status = `${what} failed (${err.message}); showing cache`;
      if (serverErr(err)) {
        state.fail.fcst += 1;
        state.next.fcst = Date.now() + backoff(state.fail.fcst, 300) * 1000;
      }
    };
    forecast(loc.point.forecast).then((data) => {
      state.forecast = { fetchedAt: new Date().toISOString(), data };
      state.fail.fcst = 0;
      recomputePrecip();
      state.status = "forecast updated";
    }).catch((err) => fail("forecast", err)).finally(done);
    forecast(loc.point.forecastHourly).then((data) => {
      state.hourly = { fetchedAt: new Date().toISOString(), data: { updated: data.updated, periods: data.periods } };
      recomputePrecip();
    }).catch((err) => fail("hourly", err)).finally(done);
    grid(loc.point.forecastGridData).then((data) => {
      state.grid = { fetchedAt: new Date().toISOString(), data };
    }).catch((err) => fail("grid", err)).finally(done);
    outlook(loc.lat, loc.lon).then((data) => {
      state.extended = { fetchedAt: new Date().toISOString(), data };
      state.extendedError = null;
      recomputePrecip();
    }).catch((err) => {
      state.extendedError = err.message;
      state.status = `12-day outlook unavailable: ${err.message}`;
    }).finally(done);
  }
  async function loadAlerts() {
    const loc = active();
    if (!loc || state.inflight.alerts) return;
    state.inflight.alerts = true;
    try {
      const alerts = await alertsActive(loc);
      noteNewAlerts(alerts);
      state.alerts = alerts;
      state.alertsAt = new Date().toISOString();
      state.fail.alerts = 0;
      state.alertInterval = 30;
      state.next.alerts = Date.now() + state.alertInterval * 1000;
      if (!String(state.status).startsWith("new alert")) state.status = `${alerts.length} active alerts`;
      saveStore();
    } catch (err) {
      state.fail.alerts += 1;
      const wait = backoff(state.fail.alerts, 120);
      state.next.alerts = Date.now() + wait * 1000;
      state.status = `alerts failed (${err.message}); showing cache; retry ${wait}s`;
    } finally {
      state.inflight.alerts = false;
      render();
    }
  }
  async function loadDiscussion() {
    const loc = active();
    if (!loc) return;
    const text = await discussion(loc);
    if (text) {
      state.discussion = { fetchedAt: new Date().toISOString(), data: text };
      state.discussionAvailable = true;
      saveStore();
      render();
    } else if (!state.discussion) {
      state.discussionAvailable = false;
      if (state.tab === "discussion") state.tab = "now";
      render();
    }
  }
  function refreshAll() {
    state.fail.obs = 0;
    state.fail.fcst = 0;
    state.next.obs = Date.now() + 600000;
    state.next.fcst = Date.now() + 1800000;
    state.next.alerts = Date.now() + 30000;
    state.status = "refreshing";
    loadObs();
    loadForecasts();
    loadAlerts();
    loadDiscussion();
  }
  async function resolveQuery(query) {
    if (state.resolving) return;
    const locExisting = active();
    state.resolving = true;
    state.draft = "";
    state.status = `resolving ${query}`;
    state.notice = `Resolving ${query}…`;
    render();
    try {
      const hit = await geocode(query);
      const point = await points(hit.lat, hit.lon);
      const nick = slug(query);
      const loc = {
        nickname: nick,
        query,
        lat: hit.lat,
        lon: hit.lon,
        point,
        lastSuccess: null,
        pointsResolvedAt: new Date().toISOString()
      };
      const idx = state.cfg.locations.findIndex((l) => l.nickname === nick);
      if (idx >= 0) state.cfg.locations[idx] = loc;
      else state.cfg.locations.push(loc);
      state.cfg.active = nick;
      state.overlay = "none";
      applyCache(nick);
      state.notice = "";
      state.status = `resolved ${hit.label || loc.point.relativeLocation || query}`;
      saveStore();
      refreshAll();
    } catch (err) {
      state.notice = String(err.message || err);
      state.status = `location failed: ${state.notice}`;
      if (!locExisting) state.overlay = "location";
      render();
    } finally {
      state.resolving = false;
    }
  }
  function switchTo(i) {
    const loc = state.cfg.locations[i];
    if (!loc) return;
    state.cfg.active = loc.nickname;
    state.selected = 0;
    state.overlay = "none";
    applyCache(loc.nickname);
    state.status = `switched to ${loc.nickname}`;
    saveStore();
    refreshAll();
  }
  function deleteSelectedLoc() {
    if (!state.cfg.locations.length) return;
    const i = Math.max(0, Math.min(state.selected, state.cfg.locations.length - 1));
    const [removed] = state.cfg.locations.splice(i, 1);
    delete state.caches[removed.nickname];
    if (state.cfg.active === removed.nickname) state.cfg.active = state.cfg.locations[0]?.nickname || null;
    state.selected = Math.max(0, Math.min(state.selected, state.cfg.locations.length - 1));
    if (state.cfg.active) applyCache(state.cfg.active);
    saveStore();
    render();
  }
  function cycleTheme() {
    state.cfg.theme = state.cfg.theme === "default" ? "high-contrast" : state.cfg.theme === "high-contrast" ? "night" : "default";
    state.status = `theme ${state.cfg.theme}`;
    saveStore();
    render();
  }
  function toggleUnits() {
    state.cfg.units = state.cfg.units === "metric" ? "imperial" : "metric";
    state.status = `units ${unitsLabel()}`;
    saveStore();
    render();
  }
  function openSelected() {
    if (state.tab === "now" && calloutAlert()) {
      const a = calloutAlert();
      state.selected = Math.max(0, state.alerts.findIndex((x) => x.id === a.id));
      state.tab = "alerts";
      state.overlay = "detail";
      render();
      return;
    }
    if (state.tab === "discussion" || state.tab === "now") return;
    if (!listLen()) return;
    state.overlay = "detail";
    render();
  }
  function openLocation() {
    state.overlay = "location";
    state.draft = "";
    state.selected = Math.max(0, state.cfg.locations.findIndex((l) => l.nickname === state.cfg.active));
    state.focusLoc = true;
    state.notice = active() ? "" : "No saved location. Enter a US ZIP or street address.";
    render();
  }

  document.getElementById("app").addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act === "close" && el.classList.contains("scrim") && e.target !== el) return;
    if (act === "tab") setTab(el.dataset.tab);
    else if (act === "select") { state.selected = +el.dataset.i; render(); }
    else if (act === "alert") { state.selected = +el.dataset.i; state.overlay = "detail"; render(); }
    else if (act === "help") { state.overlay = "help"; render(); }
    else if (act === "location") openLocation();
    else if (act === "refresh") refreshAll();
    else if (act === "theme") cycleTheme();
    else if (act === "units") toggleUnits();
    else if (act === "quit") { state.status = "This page stays open. Close the browser tab to leave."; if (state.overlay !== "none") state.overlay = "none"; render(); }
    else if (act === "dismiss") { e.stopPropagation(); dismissCallout(); }
    else if (act === "callout") openSelected();
    else if (act === "close") { if (state.overlay === "location" && !active()) return; state.overlay = "none"; render(); }
    else if (act === "switch") switchTo(+el.dataset.i);
    else if (act === "delete-loc") deleteSelectedLoc();
    else if (act === "filter") {
      state.filterSel = +el.dataset.i;
      const key = CATS[state.filterSel][0];
      state.cfg.filters[key] = !state.cfg.filters[key];
      saveStore();
      render();
    }
  });
  document.getElementById("app").addEventListener("input", (e) => {
    if (e.target.id === "loc-input") state.draft = e.target.value;
  });
  document.getElementById("app").addEventListener("submit", (e) => {
    if (e.target.dataset.act !== "resolve") return;
    e.preventDefault();
    const query = (state.draft || String(new FormData(e.target).get("q") || "")).trim();
    if (query) resolveQuery(query);
    else if (state.cfg.locations[state.selected]) switchTo(state.selected);
  });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (state.overlay === "location") {
      if (e.key === "Escape") {
        if (active()) { state.overlay = "none"; render(); }
        return;
      }
      if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        const n = state.cfg.locations.length;
        if (!n) return;
        state.selected = e.key === "ArrowUp" ? Math.max(0, state.selected - 1) : Math.min(n - 1, state.selected + 1);
        state.focusLoc = true;
        render();
        return;
      }
      if (e.key === "Delete" && !document.getElementById("loc-input")?.value) {
        deleteSelectedLoc();
      }
      return;
    }
    if (state.overlay === "help") {
      state.overlay = "none";
      render();
      return;
    }
    if (state.overlay === "filters") {
      if (["Escape", "f", "Enter"].includes(e.key)) { state.overlay = "none"; render(); return; }
      if (e.key === "j" || e.key === "ArrowDown") { state.filterSel = Math.min(CATS.length - 1, state.filterSel + 1); render(); return; }
      if (e.key === "k" || e.key === "ArrowUp") { state.filterSel = Math.max(0, state.filterSel - 1); render(); return; }
      if (e.key === " " || e.key === "x") {
        e.preventDefault();
        const key = CATS[state.filterSel][0];
        state.cfg.filters[key] = !state.cfg.filters[key];
        saveStore();
        render();
      }
      return;
    }
    if (state.overlay === "detail") {
      const body = document.getElementById("detail-body");
      if (e.key === "Escape" || e.key === "q" || e.key === "Enter") { state.overlay = "none"; render(); return; }
      if ((e.key === "j" || e.key === "ArrowDown") && body) { body.parentElement.scrollTop += 32; return; }
      if ((e.key === "k" || e.key === "ArrowUp") && body) { body.parentElement.scrollTop -= 32; return; }
      if (e.key === "x") { dismissCallout(); state.overlay = "none"; render(); }
      return;
    }
    const tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key >= "1" && e.key <= "6") {
      const tab = TABS[+e.key - 1][0];
      if (tab === "discussion" && !state.discussionAvailable) return;
      setTab(tab);
      return;
    }
    const actions = {
      "?": () => { state.overlay = "help"; render(); },
      q: () => { state.status = "This page stays open. Close the browser tab to leave."; render(); },
      j: () => { if (state.tab === "discussion") { document.querySelector(".main").scrollTop += 32; return; } moveSel(1); render(); },
      ArrowDown: () => { moveSel(1); render(); },
      k: () => { if (state.tab === "discussion") { document.querySelector(".main").scrollTop -= 32; return; } moveSel(-1); render(); },
      ArrowUp: () => { moveSel(-1); render(); },
      r: refreshAll,
      a: () => { state.next.alerts = Date.now(); state.status = "refreshing alerts"; loadAlerts(); },
      l: openLocation,
      t: cycleTheme,
      u: toggleUnits,
      x: () => dismissCallout(),
      Enter: openSelected,
      f: () => { if (state.tab === "alerts") { state.overlay = "filters"; render(); } }
    };
    if (actions[e.key]) {
      if (e.key === " ") e.preventDefault();
      actions[e.key]();
    }
  });

  setInterval(() => {
    if (!active()) return;
    const now = Date.now();
    if (now >= state.next.obs && !state.inflight.obs) {
      state.next.obs = now + 600000;
      loadObs();
    }
    if (now >= state.next.fcst && !state.inflight.fcst) {
      state.next.fcst = now + 1800000;
      loadForecasts();
    }
    if (now >= state.next.alerts && !state.inflight.alerts) loadAlerts();
    const agesEl = document.querySelector(".ages");
    if (agesEl && state.overlay === "none") agesEl.textContent = ages();
  }, 1000);

  loadStore();
  document.documentElement.dataset.theme = state.cfg.theme;
  const params = new URLSearchParams(location.search);
  const startupQuery = params.get("zip") || params.get("address");
  const startupTab = params.get("tab");
  if (TABS.some(([id]) => id === startupTab)) state.tab = startupTab;
  if (startupQuery) {
    state.overlay = "none";
    state.status = `resolving ${startupQuery}`;
    render();
    resolveQuery(startupQuery.trim());
  } else if (state.cfg.active) {
    applyCache(state.cfg.active);
    state.status = `cached ${active()?.point.relativeLocation || active()?.query || ""}`;
    render();
    refreshAll();
  } else {
    state.overlay = "location";
    state.notice = "No saved location. Enter a US ZIP or street address.";
    state.focusLoc = true;
    state.status = "no location";
    render();
  }
})();
</script>
</body>
</html>
